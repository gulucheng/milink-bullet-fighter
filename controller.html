<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MiLink 控制器</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #status {
      font-size: 16px;
      margin-bottom: 15px;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.3s;
    }
    .connected {
      color: #4caf50;
      background: rgba(76,175,80,0.15);
      border: 1px solid rgba(76,175,80,0.3);
    }
    .disconnected {
      color: #f44336;
      background: rgba(244,67,54,0.15);
      border: 1px solid rgba(244,67,54,0.3);
    }

    .section {
      width: 100%;
      max-width: 400px;
      margin-bottom: 15px;
    }
    .section-title {
      color: #6a6a8a;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-align: center;
    }

    .move-controls {
      display: flex;
      gap: 10px;
    }
    .btn-move {
      flex: 1;
      padding: 25px 10px;
      font-size: 40px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
      color: #8888aa;
      border: 2px solid #3a3a5a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .btn-move:active {
      transform: scale(0.92);
      background: linear-gradient(135deg, #3a3a6a, #2a2a5a);
      color: #aaaacc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .weapon-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-weapon {
      width: 100%;
      padding: 30px 20px;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      position: relative;
      overflow: hidden;
    }
    .btn-weapon:active {
      transform: scale(0.95);
    }
    .btn-weapon::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s;
    }
    .btn-weapon:active::after {
      width: 200px;
      height: 200px;
    }

    .btn-bullet {
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #333;
      box-shadow: 0 4px 20px rgba(255,215,0,0.3);
    }
    .btn-bullet:active {
      box-shadow: 0 2px 10px rgba(255,215,0,0.5);
    }

    .btn-missile {
      background: linear-gradient(135deg, #ff6b35, #ff3300);
      color: #fff;
      box-shadow: 0 4px 20px rgba(255,69,0,0.3);
    }
    .btn-missile:active {
      box-shadow: 0 2px 10px rgba(255,69,0,0.5);
    }

    .btn-bomb {
      background: linear-gradient(135deg, #ff44ff, #aa00ff);
      color: #fff;
      box-shadow: 0 4px 20px rgba(170,0,255,0.3);
      font-size: 24px;
      padding: 20px;
    }
    .btn-bomb:active {
      box-shadow: 0 2px 10px rgba(170,0,255,0.5);
    }

    .stats {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .stat {
      background: rgba(255,255,255,0.05);
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 14px;
      color: #8888aa;
    }
    .stat-value {
      color: #ffffff;
      font-weight: bold;
    }

    .cooldown {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: rgba(255,255,255,0.5);
      transition: width 0.1s linear;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    .pulse {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div id="status" class="disconnected">❌ 未连接</div>

  <div class="section">
    <div class="section-title">移动控制</div>
    <div class="move-controls">
      <button class="btn-move" id="btnLeft" ontouchstart="startMove('left')" ontouchend="stopMove()">◀</button>
      <button class="btn-move" id="btnRight" ontouchstart="startMove('right')" ontouchend="stopMove()">▶</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">武器系统</div>
    <div class="weapon-controls">
      <button class="btn-weapon btn-bullet" onclick="shoot('bullet')">🔫 子弹射击</button>
      <button class="btn-weapon btn-missile" onclick="shoot('missile')">🚀 导弹射击</button>
      <button class="btn-weapon btn-bomb" onclick="fireBomb()">💣 清屏炸弹</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">连接: <span class="stat-value" id="connectionTime">0s</span></div>
    <div class="stat">发射: <span class="stat-value" id="fireCount">0</span></div>
  </div>

  <script>
    const socket = io();
    const statusEl = document.getElementById('status');
    let connected = false;
    let connectTime = 0;
    let fireCount = 0;
    let moveInterval = null;

    // 连接状态
    socket.on('connect', () => {
      connected = true;
      statusEl.textContent = '✅ 已连接';
      statusEl.className = 'connected';
      connectTime = Date.now();
      updateStats();
    });

    socket.on('disconnect', () => {
      connected = false;
      statusEl.textContent = '❌ 未连接';
      statusEl.className = 'disconnected';
    });

    // 射击
    function shoot(type) {
      if (!connected) return;
      socket.emit('weapon', { type });
      fireCount++;
      document.getElementById('fireCount').textContent = fireCount;

      // 震动反馈
      if (navigator.vibrate) {
        navigator.vibrate(type === 'missile' ? 50 : 20);
      }
    }

    // 炸弹
    function fireBomb() {
      if (!connected) return;
      socket.emit('bomb');
      fireCount++;
      document.getElementById('fireCount').textContent = fireCount;

      if (navigator.vibrate) navigator.vibrate(100);
    }

    // 移动控制
    function startMove(direction) {
      if (!connected) return;
      socket.emit('move', { direction });
      moveInterval = setInterval(() => {
        socket.emit('move', { direction });
      }, 50);
    }

    function stopMove() {
      if (moveInterval) {
        clearInterval(moveInterval);
        moveInterval = null;
      }
    }

    // 统计更新
    function updateStats() {
      if (!connected) return;
      const elapsed = Math.floor((Date.now() - connectTime) / 1000);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;
      document.getElementById('connectionTime').textContent =
        minutes > 0 ? `${minutes}m${seconds}s` : `${seconds}s`;
      requestAnimationFrame(updateStats);
    }

    // 防止双击缩放
    document.addEventListener('dblclick', (e) => e.preventDefault());

    // 触摸反馈
    document.querySelectorAll('.btn-weapon, .btn-move').forEach(btn => {
      btn.addEventListener('touchstart', () => {
        btn.style.transform = 'scale(0.95)';
      });
      btn.addEventListener('touchend', () => {
        btn.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
